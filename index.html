<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Spin Wheel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Padauk', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, #0f172a);
      min-height: 100vh;
      color: #f8fafc;
    }
    .wheel-pointer {
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid #facc15;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-4">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-2">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🎡</span>
      <h1 class="text-xl font-bold text-yellow-400">Lucky Spin</h1>
    </div>
    <button onclick="resetWheel()" class="text-xs bg-red-600/80 hover:bg-red-600 text-white px-3.5 py-1.5 rounded-full font-bold transition shadow">
      🔄 Reset ပြန်စမည်
    </button>
  </header>

  <!-- Main Content -->
  <main class="w-full max-w-md flex flex-col items-center my-auto py-3">
    
    <!-- Wheel Container -->
    <div class="relative flex items-center justify-center mb-6">
      <div class="wheel-pointer absolute -top-4 z-20"></div>
      <div class="p-2 rounded-full bg-gradient-to-tr from-yellow-500 via-amber-300 to-yellow-600 shadow-2xl">
        <canvas id="wheelCanvas" width="330" height="330" class="rounded-full bg-slate-900"></canvas>
      </div>
      <div class="absolute w-12 h-12 rounded-full bg-slate-900 border-4 border-yellow-400 flex items-center justify-center shadow-lg z-10">
        <span class="text-yellow-400 font-bold text-xs">SPIN</span>
      </div>
    </div>

    <!-- Spin Control Box -->
    <div class="w-full bg-slate-800/90 border border-slate-700 rounded-2xl p-4 shadow-xl space-y-3">
      <div>
        <label class="block text-xs text-slate-300 mb-1">မဲနှိုက်မည့်သူ နာမည် (ထည့်လိုက ထည့်ပါ)</label>
        <input id="playerName" type="text" placeholder="ဥပမာ - ပထမတစ်ယောက် / အောင်အောင်" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-yellow-400" />
      </div>
      <button id="spinBtn" onclick="startSpin()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 hover:to-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition transform active:scale-95 text-base">
        🎯 လှည့်မည်
      </button>
    </div>

    <!-- Remaining Prizes -->
    <div class="w-full mt-4 bg-slate-900/70 border border-slate-800 rounded-xl p-3">
      <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
        <span>ကျန်ရှိနေသော ဆုမဲများ (ပေါက်ပြီးသား ထပ်မပါတော့ပါ)</span>
        <span id="remainingCount" class="text-yellow-400 font-bold">7 / 7</span>
      </div>
      <div id="prizeTags" class="flex flex-wrap gap-1.5"></div>
    </div>

    <!-- Winner History -->
    <div class="w-full mt-4 bg-slate-900/70 border border-slate-800 rounded-xl p-3">
      <h3 class="text-xs font-bold text-yellow-400 mb-2">🏆 ဆုမဲပေါက်သူ စာရင်း</h3>
      <div id="winnerLogList" class="space-y-2 text-xs max-h-56 overflow-y-auto">
        <p class="text-slate-500 text-center py-2">မလှည့်ရသေးပါ</p>
      </div>
    </div>

  </main>

  <!-- Winner Popup Modal -->
  <div id="winModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border-2 border-yellow-400 rounded-2xl w-full max-w-sm p-6 text-center shadow-2xl transform transition">
      <div class="text-5xl mb-2">🎉</div>
      <h2 id="modalWinnerName" class="text-lg font-bold text-yellow-400">ဂုဏ်ယူပါတယ်!</h2>
      <p class="text-xs text-slate-300 mt-1">ရရှိသော ဆုမဲမှာ</p>
      <div class="my-4 p-4 bg-slate-900 border border-yellow-500/40 rounded-xl">
        <p id="modalPrizeText" class="text-lg font-bold text-white leading-snug"></p>
      </div>
      <p class="text-[11px] text-slate-400 mb-4">ဤဆုမဲကို Wheel ပေါ်မှ ဖယ်ရှားပြီး ဖြစ်ပါသည်။</p>
      <button onclick="closeWinModal()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-2.5 rounded-xl">
        အိုကေ (နောက်တစ်ယောက် ဆက်လှည့်မည်)
      </button>
    </div>
  </div>

  <script>
    const INITIAL_PRIZES = [
      { id: 1, label: "30000MMK", short: "30,000 MMK", color: "#ef4444" },
      { id: 2, label: "20000MMK", short: "20,000 MMK", color: "#f59e0b" },
      { id: 3, label: "20000MMK", short: "20,000 MMK", color: "#10b981" },
      { id: 4, label: "10000MMK", short: "10,000 MMK", color: "#3b82f6" },
      { id: 5, label: "10000MMK", short: "10,000 MMK", color: "#8b5cf6" },
      { id: 6, label: "10000MMK", short: "10,000 MMK", color: "#ec4899" },
      { id: 7, label: "5000MMK + Mingalar Mandalay Swimming Pool Pass 2 Ticket + PUPA Oil Sheet", short: "5,000 + Pool & Oil", color: "#14b8a6" }
    ];

    const STORAGE_KEY = "single_host_spin_wheel_v1";
    let appState = loadState();
    let currentRotation = 0;
    let isSpinning = false;

    function createFreshState() {
      return {
        prizes: INITIAL_PRIZES.map(p => ({ ...p, claimed: false })),
        winners: []
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.prizes)) return parsed;
        }
      } catch (e) {}
      const fresh = createFreshState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      return fresh;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      renderUI();
    }

    function drawWheel() {
      const canvas = document.getElementById("wheelCanvas");
      const ctx = canvas.getContext("2d");
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 6;

      // Only active (unclaimed) prizes are drawn on the wheel
      const activePrizes = appState.prizes.filter(p => !p.claimed);
      const displayList = activePrizes.length > 0 
        ? activePrizes 
        : [{ short: "ဆုမဲ ၇ ဆုလုံး ကုန်ပါပြီ", color: "#334155" }];
      
      const sliceAngle = (2 * Math.PI) / displayList.length;
      ctx.clearRect(0, 0, size, size);

      displayList.forEach((prize, i) => {
        const startAngle = currentRotation + i * sliceAngle - Math.PI / 2;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.closePath();

        ctx.fillStyle = prize.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();

        // Draw Label
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px Padauk, sans-serif";
        ctx.fillText(prize.short, radius - 16, 5);
        ctx.restore();
      });
    }

    function renderUI() {
      drawWheel();

      const activePrizes = appState.prizes.filter(p => !p.claimed);
      document.getElementById("remainingCount").textContent = `${activePrizes.length} / ${appState.prizes.length}`;

      const spinBtn = document.getElementById("spinBtn");
      if (activePrizes.length === 0) {
        spinBtn.disabled = true;
        spinBtn.textContent = "✅ ဆုမဲ ၇ ဆုလုံး ထွက်ရှိပြီးပါပြီ";
        spinBtn.classList.add("opacity-50", "cursor-not-allowed");
      } else if (!isSpinning) {
        spinBtn.disabled = false;
        spinBtn.textContent = `🎯 လှည့်မည် (ကျန် ${activePrizes.length} ဆု)`;
        spinBtn.classList.remove("opacity-50", "cursor-not-allowed");
      }

      // Tags
      document.getElementById("prizeTags").innerHTML = appState.prizes.map(p => `
        <span class="px-2 py-0.5 rounded text-[11px] ${p.claimed ? 'bg-slate-800/40 text-slate-600 line-through' : 'bg-slate-800 text-slate-200 border border-slate-700'}">
          ${p.short}
        </span>
      `).join("");

      // Winner History
      const logEl = document.getElementById("winnerLogList");
      if (appState.winners.length === 0) {
        logEl.innerHTML = `<p class="text-slate-500 text-center py-2">မလှည့်ရသေးပါ</p>`;
      } else {
        logEl.innerHTML = appState.winners.map((w, i) => `
          <div class="p-2.5 rounded-lg bg-slate-800 border border-slate-700 flex justify-between items-start gap-2">
            <div>
              <span class="font-bold text-yellow-400">${i + 1}. ${w.name}</span>
              <p class="text-white mt-0.5">${w.prize}</p>
            </div>
            <span class="text-[10px] text-slate-400 shrink-0">${w.time}</span>
          </div>
        `).join("");
      }
    }

    function startSpin() {
      if (isSpinning) return;

      const activePrizes = appState.prizes.filter(p => !p.claimed);
      if (activePrizes.length === 0) return;

      const rawName = document.getElementById("playerName").value.trim();
      const playerName = rawName || `အမှတ်စဉ် (${appState.winners.length + 1})`;

      // Pick random index from ONLY remaining active prizes
      const winActiveIdx = Math.floor(Math.random() * activePrizes.length);
      const wonPrize = activePrizes[winActiveIdx];

      isSpinning = true;
      const spinBtn = document.getElementById("spinBtn");
      spinBtn.disabled = true;
      spinBtn.textContent = "🎡 လှည့်နေပါသည်...";

      // Calculate exact stop angle so top pointer hits winActiveIdx
      const sliceAngle = (2 * Math.PI) / activePrizes.length;
      const sliceCenter = winActiveIdx * sliceAngle + sliceAngle / 2;
      const extraSpins = 6 * 2 * Math.PI;
      const targetRotation = extraSpins + (2 * Math.PI - sliceCenter);

      const duration = 4000;
      const startTime = performance.now();
      const startRot = currentRotation % (2 * Math.PI);

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentRotation = startRot + (targetRotation - startRot) * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // Mark this exact prize as claimed so it is permanently removed from future spins
          const originalIdx = appState.prizes.findIndex(p => p.id === wonPrize.id);
          if (originalIdx !== -1) {
            appState.prizes[originalIdx].claimed = true;
          }

          appState.winners.push({
            name: playerName,
            prize: wonPrize.label,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });

          isSpinning = false;
          currentRotation = 0; // Reset angle cleanly for the remaining slices
          document.getElementById("playerName").value = "";
          saveState();

          // Show Popup
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          document.getElementById("modalWinnerName").textContent = `ဂုဏ်ယူပါတယ် ${playerName}!`;
          document.getElementById("modalPrizeText").textContent = wonPrize.label;
          document.getElementById("winModal").classList.remove("hidden");
          document.getElementById("winModal").classList.add("flex");
        }
      }

      requestAnimationFrame(animate);
    }

    function closeWinModal() {
      document.getElementById("winModal").classList.add("hidden");
      document.getElementById("winModal").classList.remove("flex");
    }

    function resetWheel() {
      if (!confirm("ဆုမဲ ၇ ဆုလုံးကို အစကနေ ပြန်စမှာ သေချာပါသလား?")) return;
      appState = createFreshState();
      currentRotation = 0;
      document.getElementById("playerName").value = "";
      saveState();
    }

    renderUI();
  </script>
</body>
</html>
